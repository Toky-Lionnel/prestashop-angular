<div class="login-container">
  <header class="login-header">
    <h2> Login Prestashop </h2>
    <p class="login-subtitle">Veuillez vous connecter pour continuer la commande </p>
  </header>

  <div *ngIf="errorMessage" class="error-banner">
    <span class="icon">⚠️</span>
    {{ errorMessage }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
    <div class="form-group">
      <label for="email">Adresse Email</label>
      <div class="input-wrapper">
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="exemple@domaine.com"
          required>
      </div>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="password">Mot de passe</label>
        <!-- <a href="#" class="forgot-link">Oublié ?</a> -->
      </div>
      <div class="input-wrapper">
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          required>
      </div>
    </div>

    <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
      Se connecter
    </button>
  </form>

  <!-- <footer class="login-footer">
    <p>Pas encore de compte ? <a (click)="onRegister()" class="register-link">Créez-en un</a></p>
  </footer> -->
</div>
