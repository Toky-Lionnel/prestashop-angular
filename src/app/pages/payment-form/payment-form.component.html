<div class="payment-form-container">
	<h2>Création de paiement</h2>
	<form [formGroup]="paymentForm" (ngSubmit)="submit()" class="payment-form">
		<div class="form-row">
			<div class="form-group">
				<label>Référence commande</label>
				<input type="text" formControlName="order_reference" />
				<div class="error" *ngIf="paymentForm.get('order_reference')?.touched && paymentForm.get('order_reference')?.invalid">Référence requise</div>
			</div>

			<div class="form-group">
				<label>Devise</label>
				<select formControlName="id_currency">
					<option *ngFor="let c of currencies" [value]="c.id">{{ c.name }}</option>
				</select>
			</div>
		</div>

		<div class="form-row">
			<div class="form-group">
				<label>Montant</label>
				<input type="number" formControlName="amount" step="0.01" />
				<div class="error" *ngIf="paymentForm.get('amount')?.touched && paymentForm.get('amount')?.invalid">Montant invalide</div>
			</div>

			<div class="form-group">
				<label>Méthode de paiement</label>
				<input type="text" formControlName="payment_method" />
				<div class="error" *ngIf="paymentForm.get('payment_method')?.touched && paymentForm.get('payment_method')?.invalid">Méthode requise</div>
			</div>
		</div>

		<div class="form-row">
			<div class="form-group full-width">
				<label>ID transaction</label>
				<input type="text" formControlName="transaction_id" />
			</div>
		</div>

		<div class="actions">
			<button type="submit" [disabled]="paymentForm.invalid">Enregistrer le paiement</button>
		</div>
	</form>

  <p>{{ response | json }}</p>

</div>
