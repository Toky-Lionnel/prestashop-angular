<header class="customer-navbar">
  <div class="navbar-brand">
    <span class="logo-icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="4" fill="#0284c7" />
        <path d="M7 12h10M12 7v10" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="logo-text">ClientPortal</span>
  </div>

  <div class="header-top">
    <div class="header-actions">


      <button class="btn-action btn-secondary" (click)="openProducts()" aria-label="Voir les produits">
        <span class="cart-label">Produits</span>
      </button>

      <button class="btn-action btn-cart" (click)="openCart()" aria-label="Ouvrir le panier">
        <svg class="icon-cart" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6h15l-1.5 9h-11L6 6z" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="20" r="1" fill="#0284c7"/>
          <circle cx="18" cy="20" r="1" fill="#0284c7"/>
        </svg>
        <span class="cart-label">Panier</span>
        <span class="cart-badge" aria-live="polite" aria-atomic="true">{{ cartLength }}</span>
      </button>

      <button class="btn-action btn-secondary" (click)="openOrders()">
        <span class="cart-label">Commandes</span>
      </button>

    </div>

    <button class="btn-action btn-logout" (click)="clearCustomerSession()">
      <span class="cart-label">Déconnecter</span>
    </button>
  </div>

</header>
